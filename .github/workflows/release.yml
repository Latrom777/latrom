# Тег вида v1.0.0 -> GitHub Release с готовым архивом скилла.
name: Release skill archive
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/siblead-direct-audit.zip
            dist/siblead-direct-audit-*.zip
            dist/siblead-telegram-leads.zip
            dist/siblead-telegram-leads-*.zip
            dist/siblead-chat-control.zip
            dist/siblead-chat-control-*.zip
          generate_release_notes: true
